services:
    postgres:
        container_name: sitex_bd
        image: postgres:18.0
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: my_pass
        volumes:
            - ./db_data:/var/lib/postgresql
            - ./init:/docker-entrypoint-initdb.d/
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        container_name: app_go
        image: puchkovaas/sitex-app:latest # ← теперь тянем с Docker Hub!
        # build: .
        volumes:
            - ./calendar_data:/app/calendar_data
        environment:
            CALENDAR_PATH: /app/calendar_data
            DB_HOST: postgres
            DB_USER: postgres
            DB_PASSWORD: my_pass
            DB_NAME: sitex_db
            DB_PORT: 5432
            DB_SSLMODE: disable
            LOG_LEVEL: 0
            LOG_FORMAT: 'terminal'
            PREFORK: FALSE
        ports:
            - '3001:3000'
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    pgdata:
