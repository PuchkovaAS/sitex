services:
    postgres:
        container_name: sitex_bd
        image: postgres:18
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: my_pass
        volumes:
            - pgdata:/var/lib/postgresql/data # ← стандартный путь
            - ./init:/docker-entrypoint-initdb.d/
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 5s
            retries: 5

