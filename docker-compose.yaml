services:
    postgres:
        container_name: sitex_bd
        image: postgres:16.4
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: my_pass
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - '5432:5432'

